<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>회원가입</title>
</head>
<body>

<h2>회원가입</h2>

<input id="email" placeholder="이메일"><br><br>
<input id="pw" type="password" placeholder="비밀번호"><br><br>

<button onclick="signup()">가입하기</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0Hk4g0xOCTIC1RrZkY677AN08awPHBXk",
  authDomain: "ace-baccarat-dfa2e.firebaseapp.com",
  projectId: "ace-baccarat-dfa2e",
  storageBucket: "ace-baccarat-dfa2e.firebasestorage.app",
  messagingSenderId: "609825096693",
  appId: "1:609825096693:web:6fd2d2cf5767024cca16bc",
  measurementId: "G-LRW1E07P1J"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.signup = async function(){
  const email = document.getElementById("email").value;
  const pw = document.getElementById("pw").value;

  try{
    await createUserWithEmailAndPassword(auth,email,pw);
    alert("회원가입 성공!");
  }catch(e){
    alert(e.message);
  }
}
</script>

</body>
</html>
