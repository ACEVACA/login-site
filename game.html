<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코리안 바카라 A</title>
<style>
  body{margin:0;background:#07070a;color:#fff;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',Arial}
  .betTimer{position:absolute;left:50%;top:320px;transform:translateX(-50%);
    width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
    background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)}
  .betTimer .num{font-size:32px;font-weight:900;line-height:1}
  .resultBanner{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.7);padding:20px 26px;border-radius:10px;
    border:1px solid rgba(255,255,255,.2);display:none;min-width:260px;text-align:center}
  .resultBanner.show{display:block}
  .resultBanner .top{font-weight:900;letter-spacing:.2em;opacity:.95}
  .resultBanner .mid{margin-top:6px;opacity:.85}
  .resultBanner .amt{margin-top:6px;font-size:28px;font-weight:900}
</style>
</head>
<body>

<div class="betTimer" id="betTimer">
  <svg viewBox="0 0 100 100" width="70" height="70" aria-hidden="true">
    <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,.18)" stroke-width="8" fill="none"/>
    <circle cx="50" cy="50" r="40" stroke="#22c55e" stroke-width="8"
            stroke-dasharray="60 220" stroke-linecap="round" fill="none">
      <animateTransform attributeName="transform"
        type="rotate" from="0 50 50" to="360 50 50" dur="1s" repeatCount="indefinite"/>
    </circle>
  </svg>
  <div class="num" id="betTimerNum">11</div>
</div>

<div class="resultBanner" id="resultBanner">
  <div class="top" id="rbTopText">플레이어</div>
  <div class="mid" id="rbLine1">이겼습니다</div>
  <div class="amt" id="rbAmount">₩0</div>
</div>

<script>
  const sleep = (ms)=> new Promise(r=>setTimeout(r,ms));

  let betCountdown = 11;
  let timerInt = null;

  function setBetTimerVisible(show){
    document.getElementById("betTimer").style.display = show ? "grid" : "none";
  }

  function startBettingPhase(){
    betCountdown = 11;
    document.getElementById("betTimerNum").textContent = betCountdown;
    setBetTimerVisible(true);

    if(timerInt) clearInterval(timerInt);
    timerInt = setInterval(async ()=>{
      betCountdown--;
      document.getElementById("betTimerNum").textContent = betCountdown;
      if(betCountdown <= 0){
        clearInterval(timerInt);
        await sleep(600);
        setBetTimerVisible(false);
        showResult("플레이어", 220000);
      }
    }, 1000);
  }

  function showResult(winner, amount){
    const banner = document.getElementById("resultBanner");
    document.getElementById("rbTopText").textContent = winner;
    document.getElementById("rbLine1").textContent = "이겼습니다";
    document.getElementById("rbAmount").textContent = "₩" + Number(amount).toLocaleString("ko-KR");
    banner.classList.add("show");
    setTimeout(()=>banner.classList.remove("show"), 3000);
  }

  startBettingPhase();
</script>

</body>
</html>
