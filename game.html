<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover" />
<title>Baccarat 3D</title>

<style>
:root{
  --bg:#07070a;
  --gold:#c8a23a;
  --gold2:#f2d27b;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#07070a;
  color:#fff;
}

/* TOPBAR */
.topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid rgba(200,162,58,.25);
  background:rgba(0,0,0,.6);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  letter-spacing:.15em;
}

.dot{
  width:8px;height:8px;border-radius:99px;
  background:var(--gold2);
}

/* ===== KPI BAR ===== */
.kpiBar{
  flex:1;
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:center;
}

.kpiItem{
  display:flex;
  gap:6px;
  padding:6px 12px;
  border-radius:12px;
  font-size:13px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
}

.kLabel{
  opacity:.7;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.kVal{
  font-weight:900;
}

.kP .kVal{ color:#66b3ff }
.kB .kVal{ color:#ff7b7b }
.kT .kVal{ color:#6dffb2 }

.stats{
  display:flex;
  gap:10px;
  align-items:center;
}

.pill{
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  font-size:13px;
}

.counter{
  width:34px;height:34px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--gold2);
  color:var(--gold2);
  font-weight:900;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <span>BACCARAT 3D</span>
  </div>

  <!-- KPI BAR -->
  <div class="kpiBar">
    <div class="kpiItem"><span class="kLabel">Hands</span><span class="kVal" id="kHands">0</span></div>
    <div class="kpiItem kP"><span class="kLabel">P</span><span class="kVal" id="kP">0%</span></div>
    <div class="kpiItem kB"><span class="kLabel">B</span><span class="kVal" id="kB">0%</span></div>
    <div class="kpiItem kT"><span class="kLabel">T</span><span class="kVal" id="kT">0%</span></div>
    <div class="kpiItem"><span class="kLabel">Streak</span><span class="kVal" id="kStreak">-</span></div>
  </div>

  <div class="stats">
    <div class="pill">Balance: <b id="balance">1,000,000</b></div>
    <div class="pill">Bet: <b id="betTotalTop">0</b></div>
    <div class="counter" id="shoeRemain">0</div>
  </div>
</div>

<script>
/* ===== KPI LOGIC ===== */
const roundHistory = [];

function updateKPI(){
  const hands = roundHistory.length;
  const p = roundHistory.filter(x=>x==="player").length;
  const b = roundHistory.filter(x=>x==="banker").length;
  const t = roundHistory.filter(x=>x==="tie").length;

  const pct = n => hands ? Math.round(n/hands*100) : 0;

  document.getElementById("kHands").textContent = hands;
  document.getElementById("kP").textContent = pct(p)+"%";
  document.getElementById("kB").textContent = pct(b)+"%";
  document.getElementById("kT").textContent = pct(t)+"%";

  if(hands>0){
    let streak=1;
    for(let i=1;i<hands;i++){
      if(roundHistory[i]===roundHistory[0]) streak++;
      else break;
    }
    document.getElementById("kStreak").textContent =
      roundHistory[0][0].toUpperCase()+"×"+streak;
  }
}

/* 너의 dealRound() 안에서 winner 결정 후
   roundHistory.unshift(winner);
   updateKPI();
   이 두 줄만 추가해주면 됨 */
</script>
roundHistory.unshift(winner);
updateKPI();
