<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>홈</title>
  <link rel="stylesheet" href="./assets/app.css" />
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="brand">
        <div class="logo"></div>
        <h1>로그인 완료</h1>
        <p class="sub" id="who">확인 중...</p>
      </div>

      <button class="btn" id="logout" type="button">
        로그아웃
      </button>

      <p class="msg" id="msg">잠시 후 이동합니다…</p>

      <div class="footer">
        <a class="link" href="./game.html">바로 이동 →</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0Hk4g0xOCTIC1RrZkY677AN08awPHBXk",
      authDomain: "ace-baccarat-dfa2e.firebaseapp.com",
      projectId: "ace-baccarat-dfa2e",
      storageBucket: "ace-baccarat-dfa2e.firebasestorage.app",
      messagingSenderId: "609825096693",
      appId: "1:609825096693:web:6fd2d2cf5767024cca16bc",
      measurementId: "G-LRW1E07P1J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const who = document.getElementById("who");
    const msg = document.getElementById("msg");
    const logoutBtn = document.getElementById("logout");

    // 로그인 상태 체크
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        location.href = "./index.html";
        return;
      }

      who.textContent = "환영합니다: " + user.email;
      msg.textContent = "1초 후 게임 화면으로 이동합니다…";

      setTimeout(() => {
        location.href = "./game.html";
      }, 1000);
    });

    // 로그아웃 버튼
    logoutBtn.onclick = async () => {
      try {
        logoutBtn.disabled = true;
        logoutBtn.classList.add("loading");
        msg.textContent = "로그아웃 중…";
        await signOut(auth);
        location.href = "./index.html";
      } catch (e) {
        console.error(e);
        msg.textContent = "로그아웃에 실패했어요. 다시 시도해 주세요.";
      } finally {
        logoutBtn.disabled = false;
        logoutBtn.classList.remove("loading");
      }
    };
  </script>
</body>
</html>
