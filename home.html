<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>홈</title>
</head>

<body>
  <h2>로그인 완료</h2>
  <p id="who"></p>
  <button id="logout">로그아웃</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0Hk4g0xOCTIC1RrZkY677AN08awPHBXk",
      authDomain: "ace-baccarat-dfa2e.firebaseapp.com",
      projectId: "ace-baccarat-dfa2e",
      storageBucket: "ace-baccarat-dfa2e.firebasestorage.app",
      messagingSenderId: "609825096693",
      appId: "1:609825096693:web:6fd2d2cf5767024cca16bc",
      measurementId: "G-LRW1E07P1J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 로그인 상태 체크
    onAuthStateChanged(auth, (user) => {

      // 로그인 안 했으면 로그인 페이지로
      if (!user) {
        location.href = "index.html";
        return;
      }

      // 로그인 했으면 이메일 표시
      document.getElementById("who").textContent =
        "환영합니다: " + user.email;

      // ✅ 1초 후 게임사이트로 이동
      setTimeout(() => {
        window.location.href = "https://ace-play-52d6a.web.app/";
      }, 1000);
    });

    // 로그아웃 버튼
    document.getElementById("logout").onclick =
      () => signOut(auth);
  </script>
</body>
</html>
