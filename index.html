<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>로그인</title>

  <style>
    :root{
      --text:#ffffff;
      --muted:#d1d5db;
      --line: rgba(255,255,255,.16);
      --card: rgba(0,0,0,.72);
      --shadow: 0 22px 70px rgba(0,0,0,.65);
      --gold1:#f6d365;
      --gold2:#fda085;
      --danger:#ff6b6b;
      --ok:#34d399;
    }

    *{ box-sizing:border-box; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    body{ margin:0; color:var(--text); }

    /* ✅ 배경: 선명하게 (어두운 덮개 제거) */
    .page{
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:24px;
      background: url("./assets/login-bg.png") center/cover no-repeat;
      /* iOS에서 fixed는 종종 깨져서 아예 안 씀 */
      overflow:hidden;
    }

    /* ✅ 중앙 카드 (블러 제거해서 배경 흐려지지 않게) */
    .card{
      width:min(420px, 100%);
      padding:28px;
      border-radius:22px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
    }

    h1{
      margin:0 0 18px 0;
      text-align:center;
      font-size:24px;
      letter-spacing:.5px;
      text-shadow: 0 8px 24px rgba(0,0,0,.55);
    }

    .field{ margin-top:14px; }
    .field label{
      display:block;
      font-size:13px;
      color: var(--muted);
      margin-bottom:8px;
    }

    .inputWrap{ position:relative; }
    input{
      width:100%;
      padding:12px 44px 12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--text);
      outline:none;
      transition:.18s ease;
    }
    input::placeholder{ color: rgba(209,213,219,.75); }
    input:focus{
      border-color: rgba(246,211,101,.65);
      box-shadow: 0 0 0 4px rgba(246,211,101,.14);
    }

    .iconBtn{
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      width:32px;
      height:32px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.10);
      color: var(--text);
      cursor:pointer;
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin:14px 0 16px;
    }

    .check{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      color: var(--muted);
    }

    .link{
      color:#ffe7b0;
      text-decoration:none;
      font-size:13px;
    }
    .link:hover{ text-decoration:underline; }

    .btn{
      width:100%;
      height:48px;
      border:none;
      border-radius:14px;
      font-weight:900;
      color:#1a1200;
      background: linear-gradient(135deg, var(--gold1), var(--gold2));
      cursor:pointer;
      transition: transform .08s ease, filter .18s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .btn:hover{ filter:brightness(1.04); }
    .btn:active{ transform: translateY(1px); }
    .btn[disabled]{ opacity:.75; cursor:not-allowed; }

    .spinner{
      width:16px;height:16px;border-radius:999px;
      border:2px solid rgba(26,18,0,.25);
      border-top-color: rgba(26,18,0,.95);
      animation: spin .8s linear infinite;
      display:none;
    }
    .btn.loading .spinner{ display:inline-block; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    .msg{
      margin-top:12px;
      min-height:18px;
      font-size:13px;
      text-align:center;
      color: var(--muted);
    }
    .msg.err{ color: var(--danger); }
    .msg.ok{ color: var(--ok); }

    .footer{
      margin-top:16px;
      text-align:center;
      font-size:13px;
      color: var(--muted);
    }

    /* 모바일에서 카드 너무 커 보이면 살짝 줄이기 */
    @media (max-width: 420px){
      .card{ padding:22px; border-radius:18px; }
      h1{ font-size:22px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h1>로그인</h1>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">이메일</label>
          <div class="inputWrap">
            <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="pw">비밀번호</label>
          <div class="inputWrap">
            <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <button class="iconBtn" type="button" id="togglePw" aria-label="비밀번호 보기/숨기기">👁</button>
          </div>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember" />
            <span>로그인 유지</span>
          </label>
          <a class="link" href="./signup.html">회원가입</a>
        </div>

        <button class="btn" id="submitBtn" type="submit">
          <span class="spinner"></span>
          <span id="btnText">로그인</span>
        </button>

        <p class="msg" id="msg"></p>
      </form>

      <div class="footer">
        <span>계정이 없나요?</span> <a class="link" href="./signup.html">회원가입</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0Hk4g0xOCTIC1RrZkY677AN08awPHBXk",
      authDomain: "ace-baccarat-dfa2e.firebaseapp.com",
      projectId: "ace-baccarat-dfa2e",
      storageBucket: "ace-baccarat-dfa2e.firebasestorage.app",
      messagingSenderId: "609825096693",
      appId: "1:609825096693:web:6fd2d2cf5767024cca16bc",
      measurementId: "G-LRW1E07P1J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $ = (id) => document.getElementById(id);
    const form = $("loginForm");
    const msg = $("msg");
    const btn = $("submitBtn");
    const btnText = $("btnText");
    const emailEl = $("email");
    const pwEl = $("pw");
    const rememberEl = $("remember");

    $("togglePw").addEventListener("click", () => {
      pwEl.type = (pwEl.type === "password") ? "text" : "password";
    });

    function setMessage(text, type){
      msg.textContent = text || "";
      msg.classList.remove("err","ok");
      if(type) msg.classList.add(type);
    }

    function friendlyError(e){
      const code = e?.code || "";
      if (code.includes("auth/invalid-email")) return "이메일 형식이 올바르지 않아요.";
      if (code.includes("auth/missing-password")) return "비밀번호를 입력해 주세요.";
      if (code.includes("auth/invalid-credential")) return "이메일 또는 비밀번호가 올바르지 않아요.";
      if (code.includes("auth/too-many-requests")) return "시도가 너무 많아요. 잠시 후 다시 시도해 주세요.";
      return "로그인에 실패했어요. 다시 시도해 주세요.";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailEl.value.trim();
      const pw = pwEl.value;

      setMessage("로그인 중...", "");
      btn.disabled = true;
      btn.classList.add("loading");
      btnText.textContent = "로그인 중...";

      try {
        await setPersistence(auth, rememberEl.checked ? browserLocalPersistence : browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, pw);
        setMessage("로그인 성공! 이동 중...", "ok");
        location.href = "./home.html";
      } catch (err) {
        setMessage(friendlyError(err), "err");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.classList.remove("loading");
        btnText.textContent = "로그인";
      }
    });
  </script>
</body>
</html>
