<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로그인</title>

  <style>
    :root{
      --text:#ffffff;
      --muted:#d1d5db;
      --line: rgba(255,255,255,.16);
      --card: rgba(0,0,0,.72);
      --shadow: 0 22px 70px rgba(0,0,0,.65);
      --gold1:#f6d365;
      --gold2:#fda085;
      --danger:#ff6b6b;
      --ok:#34d399;
    }

    *{
      box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }

    body{
      margin:0;
      color:var(--text);
      background: url("./assets/login-bg.png") center/cover no-repeat fixed;
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:420px;
      padding:32px;
      border-radius:22px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
    }

    h1{
      margin:0 0 22px 0;
      text-align:center;
      font-size:24px;
      letter-spacing:.5px;
    }

    .field{ margin-top:16px; }

    .field label{
      display:block;
      font-size:13px;
      color: var(--muted);
      margin-bottom:8px;
    }

    input{
      width:100%;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--text);
      outline:none;
      transition:.18s ease;
    }

    input::placeholder{
      color: rgba(209,213,219,.75);
    }

    input:focus{
      border-color: rgba(246,211,101,.65);
      box-shadow: 0 0 0 4px rgba(246,211,101,.14);
    }

    /* ✅ 로그인 유지 가로 고정 */
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin:16px 0 20px;
      flex-wrap:nowrap;
    }

    .check{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:13px;
      color: var(--muted);
      white-space:nowrap;
    }

    .check input{
      width:16px;
      height:16px;
      margin:0;
      flex:0 0 auto;
    }

    .link{
      color:#ffe7b0;
      text-decoration:none;
      font-size:13px;
    }

    .link:hover{
      text-decoration:underline;
    }

    .btn{
      width:100%;
      height:48px;
      border:none;
      border-radius:14px;
      font-weight:900;
      color:#1a1200;
      background: linear-gradient(135deg, var(--gold1), var(--gold2));
      cursor:pointer;
      transition: transform .08s ease, filter .18s ease;
    }

    .btn:hover{
      filter:brightness(1.05);
    }

    .btn:active{
      transform: translateY(1px);
    }

    .msg{
      margin-top:14px;
      min-height:18px;
      font-size:13px;
      text-align:center;
      color: var(--muted);
    }

    .msg.err{ color: var(--danger); }
    .msg.ok{ color: var(--ok); }

    .footer{
      margin-top:18px;
      text-align:center;
      font-size:13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h1>로그인</h1>

      <form id="loginForm" autocomplete="on">

        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="pw">비밀번호</label>
          <input id="pw" type="password" placeholder="••••••••" required />
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember" />
            <span>로그인 유지</span>
          </label>
          <a class="link" href="./signup.html">회원가입</a>
        </div>

        <button class="btn" type="submit">로그인</button>

        <p class="msg" id="msg"></p>
      </form>

      <div class="footer">
        계정이 없나요? <a class="link" href="./signup.html">회원가입</a>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0Hk4g0xOCTIC1RrZkY677AN08awPHBXk",
  authDomain: "ace-baccarat-dfa2e.firebaseapp.com",
  projectId: "ace-baccarat-dfa2e",
  storageBucket: "ace-baccarat-dfa2e.firebasestorage.app",
  messagingSenderId: "609825096693",
  appId: "1:609825096693:web:6fd2d2cf5767024cca16bc",
  measurementId: "G-LRW1E07P1J"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("pw").value;
  const remember = document.getElementById("remember").checked;

  msg.textContent = "로그인 중...";
  msg.className = "msg";

  try {
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, pw);

    msg.textContent = "로그인 성공! 이동 중...";
    msg.classList.add("ok");

    location.href = "./home.html";

  } catch (e) {
    msg.textContent = "이메일 또는 비밀번호가 올바르지 않습니다.";
    msg.classList.add("err");
  }
});
</script>

</body>
</html>
