<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>로그인</title>

  <style>
    :root{
      --text:#ffffff;
      --muted:#dddddd;
      --danger:#ff6b6b;
      --gold1:#f6d365;
      --gold2:#fda085;
    }

    *{
      box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }

    body{
      margin:0;
    }

    /* ===== 배경 이미지 ===== */
    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: url("./assets/login-bg.png") center/cover no-repeat;
      position:relative;
    }

    /* 어둡게 덮어서 가독성 확보 */
    .page::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.65);
    }

    /* ===== 로그인 카드 ===== */
    .card{
      position:relative;
      width:380px;
      padding:30px;
      border-radius:20px;
      background:rgba(0,0,0,0.75);
      backdrop-filter:blur(8px);
      box-shadow:0 20px 50px rgba(0,0,0,0.7);
      color:var(--text);
    }

    h1{
      margin:0 0 20px 0;
      text-align:center;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:14px;
      border-radius:12px;
      border:none;
      outline:none;
      background:rgba(255,255,255,0.1);
      color:white;
      font-size:14px;
    }

    input::placeholder{
      color:#ccc;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      font-weight:bold;
      font-size:15px;
      background:linear-gradient(135deg,var(--gold1),var(--gold2));
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      opacity:0.9;
      transform:translateY(-1px);
    }

    .msg{
      margin-top:10px;
      font-size:13px;
      min-height:18px;
      text-align:center;
    }

    .error{
      color:var(--danger);
    }

    .link{
      display:block;
      margin-top:15px;
      text-align:center;
      font-size:13px;
      color:#ffd27f;
      text-decoration:none;
    }

    .link:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h1>로그인</h1>

      <form id="loginForm">
        <input id="email" type="email" placeholder="이메일" required />
        <input id="pw" type="password" placeholder="비밀번호" required />

        <button type="submit">로그인</button>

        <div class="msg" id="msg"></div>
      </form>

      <a href="signup.html" class="link">계정이 없으면 회원가입</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0Hk4g0xOCTIC1RrZkY677AN08awPHBXk",
      authDomain: "ace-baccarat-dfa2e.firebaseapp.com",
      projectId: "ace-baccarat-dfa2e",
      storageBucket: "ace-baccarat-dfa2e.firebasestorage.app",
      messagingSenderId: "609825096693",
      appId: "1:609825096693:web:6fd2d2cf5767024cca16bc",
      measurementId: "G-LRW1E07P1J"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const pw = document.getElementById("pw").value;

      msg.textContent = "로그인 중...";

      try {
        await signInWithEmailAndPassword(auth, email, pw);
        location.href = "home.html";
      } catch (e) {
        msg.textContent = "이메일 또는 비밀번호가 올바르지 않습니다.";
        msg.classList.add("error");
      }
    });
  </script>
</body>
</html>
